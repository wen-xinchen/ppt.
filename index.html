<html lang="zh-Hant">
<head>

  <style>
    :root {
      --rose-quartz: #F7CAC9;
      --rose-soft: #FDF5F5;
      --serenity: #92A8D1;
      --serenity-soft: #F2F5FA;
      --serenity-dark: #5C76A6;
      --bg-main: #FAFAFC;
      --bg-card: #FFFFFF;
      --text-main: #1E2430;
      --text-muted: #5A6475;
      --border-color: #E2E8F0;
      --shadow-sm: 0 2px 8px rgba(30, 36, 48, 0.05);
      --shadow-md: 0 8px 24px rgba(146, 168, 209, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.7;
      display: flex;
      min-height: 100vh;
    }

    .top-accent {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--rose-quartz) 0%, var(--serenity) 100%);
      z-index: 1000;
    }

    aside.sidebar {
      width: 280px;
      background: var(--bg-card);
      border-right: 1px solid var(--border-color);
      padding: 24px 18px;
      position: fixed;
      top: 4px; bottom: 0; left: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-badge {
      display: inline-block;
      width: fit-content;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--rose-quartz), var(--serenity));
      color: #1E2430;
    }

    .brand h1 { font-size: 19px; font-weight: 800; margin-top: 4px; }
    .brand p { font-size: 12px; color: var(--text-muted); }

    .slides-cta {
      display: block;
      text-align: center;
      text-decoration: none;
      background: linear-gradient(90deg, var(--rose-quartz), var(--serenity));
      color: #1E2430;
      font-weight: 800;
      font-size: 13px;
      padding: 9px 12px;
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
    }

    .search-box input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 13px;
      background: var(--bg-main);
      color: var(--text-main);
      outline: none;
    }

    .nav-group h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 6px;
      padding-left: 8px;
    }

    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 13.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-item:hover { background: var(--serenity-soft); }
    .nav-item.active {
      background: linear-gradient(90deg, rgba(247, 202, 201, 0.38) 0%, rgba(146, 168, 209, 0.32) 100%);
      font-weight: 700;
    }
    .nav-tag {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-main);
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    main.content-wrapper {
      margin-left: 280px;
      flex: 1;
      padding: 36px 48px 80px;
      max-width: 1060px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .breadcrumb { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .breadcrumb span.link { color: var(--serenity-dark); cursor: pointer; font-weight: 600; }
    .agents-pill {
      font-size: 12px;
      background: var(--rose-soft);
      border: 1px solid var(--rose-quartz);
      color: #6B3A39;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
    }

    article.wiki-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 32px 36px;
      box-shadow: var(--shadow-sm);
    }

    .yaml-header { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
    .cat-badge {
      font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 6px;
      background: var(--serenity-soft); color: var(--serenity-dark);
    }
    .tag-pill { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #F4F5F7; color: var(--text-muted); }
    .updated-text { font-size: 12px; color: var(--text-muted); margin-left: auto; }

    article.wiki-card h2.page-title {
      font-size: 28px; font-weight: 800; margin-bottom: 14px;
      border-bottom: 2px solid var(--rose-quartz); padding-bottom: 10px;
    }

    .summary-box {
      background: linear-gradient(135deg, var(--rose-soft) 0%, var(--serenity-soft) 100%);
      border-left: 4px solid var(--serenity);
      padding: 14px 18px;
      border-radius: 0 10px 10px 0;
      margin-bottom: 24px;
      font-size: 15px;
    }

    .section-title { font-size: 18px; font-weight: 700; margin: 26px 0 12px; display: flex; align-items: center; gap: 8px; }
    .section-title::before { content: ""; display: inline-block; width: 6px; height: 18px; border-radius: 3px; background: var(--serenity); }

    table.wiki-table { width: 100%; border-collapse: collapse; margin: 12px 0 22px; font-size: 14px; }
    table.wiki-table th, table.wiki-table td { border: 1px solid var(--border-color); padding: 10px 14px; text-align: left; }
    table.wiki-table th { background: var(--serenity-soft); font-weight: 700; width: 26%; }
    table.wiki-table.full-grid th { width: auto; }

    a.wikilink {
      color: var(--serenity-dark);
      background: rgba(146, 168, 209, 0.14);
      padding: 1px 6px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1.5px solid var(--serenity);
      cursor: pointer;
    }
    a.wikilink:hover { background: var(--rose-quartz); color: #1E2430; }

    ul.wiki-bullets { padding-left: 20px; margin-bottom: 16px; }
    ul.wiki-bullets li { margin-bottom: 8px; }

    .source-box {
      margin-top: 28px; padding-top: 16px; border-top: 1px dashed var(--border-color);
      font-size: 13px; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    }
    .source-btn {
      background: #F1F5F9; border: 1px solid var(--border-color);
      padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .source-btn:hover { background: var(--serenity-soft); border-color: var(--serenity); }

    .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin: 14px 0 24px; }
    .mini-card { border: 1px solid var(--border-color); border-radius: 10px; padding: 14px 16px; background: #FFFFFF; cursor: pointer; }
    .mini-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--serenity); }
    .mini-card-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .mini-card-sub { font-size: 12.5px; color: var(--text-muted); }

    .backlinks-panel { margin-top: 24px; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 10px; padding: 16px 20px; }
    .backlinks-panel h4 { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
    .backlinks-list { display: flex; flex-wrap: wrap; gap: 8px; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
    .modal-backdrop.open { display: flex; }
    .modal-box { background: #FFFFFF; border-radius: 12px; max-width: 760px; width: 100%; max-height: 82vh; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { padding: 16px 20px; background: linear-gradient(90deg, var(--rose-soft), var(--serenity-soft)); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; }
    .modal-body { padding: 20px; overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; background: #F8FAFC; line-height: 1.6; }

    @media (max-width: 860px) {
      body { flex-direction: column; }
      aside.sidebar { position: static; width: 100%; }
      main.content-wrapper { margin-left: 0; padding: 24px 18px 60px; }
    }
  </style>
</head>

    let currentSlug = "index";

    function parseWikilinks(text) {
      if (!text) return "";
      return text.replace(/\[\[([^|\]]+)(?:\|([^\]]+))?\]\]/g, (_, target, label) => {
        const cleanSlug = target.trim().toLowerCase();
        const display = (label || target).trim();
        const exists = Boolean(WIKI_PAGES[cleanSlug]);
        return `<a class="wikilink" onclick="navigateTo('${cleanSlug}')" title="${exists ? '前往條目：' + WIKI_PAGES[cleanSlug].title : '尚未建立條目'}">${display}</a>`;
      });
    }

    function renderSidebar(filterText = "") {
      const q = filterText.trim().toLowerCase();
      const groups = [
        { label: "導航與總覽", items: ["index", "timeline", "going-seventeen", "log"] },
        { label: "分隊 (Units)", items: ["hip-hop-team", "vocal-team", "performance-team", "bss", "jxw"] },
        { label: "音樂作品 (Discography)", items: ["2015-17-carat", "2023-fml"] },
        { label: "成員檔案 (13 Members)", items: MEMBERS.map(m => m[0]) }
      ];

      const navContainer = document.getElementById("navContainer");
      navContainer.innerHTML = groups.map(g => {
        const filtered = g.items.filter(slug => {
          const p = WIKI_PAGES[slug];
          if (!p) return false;
          if (!q) return true;
          return (
            slug.includes(q) ||
            p.title.toLowerCase().includes(q) ||
            p.tags.some(t => t.toLowerCase().includes(q)) ||
            p.summary.toLowerCase().includes(q)
          );
        });

        if (filtered.length === 0) return "";
        return `
          <div class="nav-group" style="margin-bottom: 14px;">
            <h3>${g.label}</h3>
            <ul class="nav-list">
              ${filtered.map(slug => {
                const p = WIKI_PAGES[slug];
                const shortTitle = p.title.split("(")[0].trim();
                return `
                  <li class="nav-item ${slug === currentSlug ? 'active' : ''}" onclick="navigateTo('${slug}')">
                    <span>${shortTitle}</span>
                    <span class="nav-tag">${p.category}</span>
                  </li>
                `;
              }).join("")}
            </ul>
          </div>
        `;
      }).join("");
    }

    function renderBacklinks(targetSlug) {
      const backlinks = [];
      const regex = new RegExp(`\[\[${targetSlug}(\|[^\]]+)?\]\]`, "i");

      Object.entries(WIKI_PAGES).forEach(([slug, page]) => {
        if (slug === targetSlug) return;
        const blob = JSON.stringify(page);
        if (regex.test(blob)) {
          backlinks.push({ slug, title: page.title });
        }
      });

      const listEl = document.getElementById("backlinksList");
      if (backlinks.length === 0) {
        listEl.innerHTML = `<span style="font-size:13px;color:var(--text-muted);">目前尚無其他頁面引用此條目。</span>`;
      } else {
        listEl.innerHTML = backlinks.map(b =>
          `<a class="wikilink" onclick="navigateTo('${b.slug}')">${b.title}</a>`
        ).join("");
      }
    }

    function navigateTo(slug) {
      if (!WIKI_PAGES[slug]) return;
      currentSlug = slug;
      const page = WIKI_PAGES[slug];

      document.getElementById("breadcrumb").innerHTML = `
        <span class="link" onclick="navigateTo('index')">wiki</span>
        <span>/</span>
        <span>${page.category}</span>
        <span>/</span>
        <strong>${slug}.md</strong>
      `;

      let infoboxHtml = "";
      if (page.infobox) {
        infoboxHtml = `
          <h3 class="section-title">核心資訊摘要</h3>
          <table class="wiki-table">
            <tbody>
              ${page.infobox.map(([k, v]) => `
                <tr>
                  <th>${k}</th>
                  <td>${parseWikilinks(v)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      let tracklistHtml = "";
      if (page.tracklist) {
        tracklistHtml = `
          <h3 class="section-title">收錄曲目列表</h3>
          <table class="wiki-table full-grid">
            <thead>
              <tr>
                <th>曲序</th>
                <th>曲名</th>
                <th>演唱分隊 / 成員</th>
                <th>備註</th>
              </tr>
            </thead>
            <tbody>
              ${page.tracklist.map(([no, song, unit, note]) => `
                <tr>
                  <td>${no}</td>
                  <td>${song}</td>
                  <td>${parseWikilinks(unit)}</td>
                  <td>${note}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      let bulletsHtml = "";
      if (page.bullets) {
        bulletsHtml = `
          <h3 class="section-title">詳細紀錄與特色</h3>
          <ul class="wiki-bullets">
            ${page.bullets.map(b => `<li>${parseWikilinks(b)}</li>`).join("")}
          </ul>
        `;
      }

      const customHtml = page.renderCustom ? page.renderCustom() : "";
      const sourcesHtml = (page.sources || []).map(src =>
        `<button class="source-btn" onclick="openModal('${src}')">📄 檢視原始資料：${src}</button>`
      ).join(" ");

      document.getElementById("wikiContent").innerHTML = `
        <div class="yaml-header">
          <span class="cat-badge">${page.category.toUpperCase()}</span>
          ${page.tags.map(t => `<span class="tag-pill">#${t}</span>`).join("")}
          <span class="updated-text">最後更新：${page.last_updated}</span>
        </div>
        <h2 class="page-title">${page.title}</h2>
        <div class="summary-box">${parseWikilinks(page.summary)}</div>
        ${customHtml}
        ${infoboxHtml}
        ${tracklistHtml}
        ${bulletsHtml}
        <div class="source-box">
          <span>🔒 事實溯源（<code>raw/</code> 唯讀層）：</span>
          <div>${sourcesHtml || "無外部來源"}</div>
        </div>
      `;

      renderSidebar(document.getElementById("searchInput").value);
      renderBacklinks(slug);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openModal(key) {
      const item = RAW_SOURCES[key];
      if (!item) return;
      document.getElementById("modalTitle").textContent = item.title;
      document.getElementById("modalBody").textContent = item.content;
      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      renderSidebar(e.target.value);
    });

    navigateTo("index");
  </script>
</body>
</html>
